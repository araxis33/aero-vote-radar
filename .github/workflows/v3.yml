name: Aero scan

on:
  schedule:
    # Hourly, at :47 rather than on the hour (off the top-of-hour cron pileup, and
    # this repo previously ran a coarser 4-hourly snapshot that left the ranking
    # stale against the 47 h move timer and pools filling up within hours — this
    # job replaced it). GitHub starts scheduled runs hours late (3–5 h apart in
    # practice), so each run also queues the next one itself (last step); this
    # cron only restarts that chain if it breaks.
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: v3
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      # Aero's seven networks (src/v3-cli.ts); a network that fails is recorded in the
      # file and the others still publish.
      - name: Scan Aero (v3)
        run: npm run v3scan

      - name: Commit the scan if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/v3.json docs/data/v3-history.json docs/data/top-allocators.json docs/llms.txt
          if git diff --cached --quiet; then
            echo "v3 unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Refresh the Aero scan"
          # Other automated commits (e.g. the daily improvement routine) can land
          # on main around the same time, so rebase before pushing rather than fail.
          git pull --rebase
          git push

      # Wait for the next :47 and start the next scan. A dispatch from GITHUB_TOKEN
      # does start a run; the concurrency group keeps one running and one waiting,
      # so a late scheduled run and this one never pile up.
      - name: Queue the next scan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          wait=$(( (47 * 60 - now % 3600 + 7200) % 3600 ))
          [ "$wait" -lt 300 ] && wait=$(( wait + 3600 ))
          echo "next scan in $(( wait / 60 )) min"
          sleep "$wait"
          # One failed dispatch used to end the chain until the late hourly cron
          # restarted it (25.11: HTTP 500 during a GitHub outage, 28 min without scans).
          # Retry 6 times, 2 min apart (~10 min). A dispatch that errored but still
          # created a run only adds one extra scan: the v3 group keeps a single waiting run.
          for try in 1 2 3 4 5 6; do
            if gh workflow run v3.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"; then
              exit 0
            fi
            [ "$try" -lt 6 ] && { echo "dispatch failed (try $try), retrying in 2 min"; sleep 120; }
          done
          exit 1
